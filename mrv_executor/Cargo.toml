[package]
name = "mrv_executor"
version = "0.1.0"
edition = "2021"

[features]
benchmark = ["ed25519-dalek"]

[dependencies]
# 异步运行时
tokio = { version = "1.0", features = ["sync", "rt", "macros"] }
# 日志工具
log = "0.4"
# Narwhal 内部模块依赖
primary = { path = "../primary" }
crypto = { path = "../crypto" }
consensus = { path = "../consensus" }
ed25519-dalek = { version = "1.0.1", optional = true }

[dev-dependencies]
rand = "0.7"
config = { path = "../config" }
